<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gold Dashboard</title>
<style>
  /* การ์ดออกแบบมาให้ลอยบน wallpaper -- หน้าเว็บใส่พื้นมืดไล่เฉดแทน ให้ความโปร่งของการ์ดยังดูเหมือนเดิม */
  :root { color-scheme: dark; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(1200px 700px at 20% 10%, #2a3a78 0%, transparent 60%),
                radial-gradient(1000px 600px at 90% 90%, #5b2a6e 0%, transparent 55%),
                #0f1220;
    color: #fff; overflow-x: auto;
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", sans-serif;
  }
  #boot { padding: 40px; color: rgba(255,255,255,.6); font-size: 13px; }
  #boot.err { color: #ff8a80; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="root"><div id="boot">กำลังโหลด dashboard…</div></div>

<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js"></script>
<script>
// ---------------------------------------------------------------------------
// host ขั้นต่ำที่ทำตัวแบบ Übersicht: โหลด widget ตัวเดียวกับบน desktop (gold-dashboard.jsx)
// transpile ในเบราว์เซอร์ แล้ววน initialState -> command(dispatch) -> updateState -> render
// แก้หน้าตาที่ .jsx ที่เดียว หน้านี้ไม่มี UI ของตัวเอง
// ---------------------------------------------------------------------------
window.APPHUB_WEB = true;

// โมดูล 'uebersicht' ปลอม: บนเว็บไม่มี shell -- widget เช็ค WEB แล้วไม่เรียก run() เอง
// ถ้ามีจุดไหนหลุดมาเรียก ให้พังดังๆ ใน console ดีกว่าเงียบ
const uebersicht = {
  run: (cmd) => Promise.reject(new Error('run() ใช้บนเว็บไม่ได้: ' + cmd)),
};

function boot(msg, isErr) {
  const el = document.getElementById('boot');
  if (el) { el.textContent = msg; el.className = isErr ? 'err' : ''; }
}

fetch('/dashboard/widget.jsx', { cache: 'no-store' })
  .then((r) => { if (!r.ok) throw new Error('โหลด widget ไม่ได้ HTTP ' + r.status); return r.text(); })
  .then((src) => {
    const code = Babel.transform(src, {
      presets: ['react'], plugins: ['transform-modules-commonjs'], filename: 'gold-dashboard.jsx',
    }).code;
    const exports = {};
    const require = (name) => {
      if (name === 'uebersicht') return uebersicht;
      throw new Error('ไม่รู้จักโมดูล ' + name);
    };
    new Function('require', 'exports', 'React', code)(require, exports, React);
    return exports;
  })
  .then((w) => {
    const root = ReactDOM.createRoot(document.getElementById('root'));
    let state = w.initialState || {};
    const paint = () => root.render(w.render(state, dispatch));
    function dispatch(ev) {
      state = w.updateState ? w.updateState(ev, state) : state;
      paint();
    }
    paint();
    const tick = () => { try { w.command(dispatch); } catch (e) { console.error(e); } };
    tick();
    setInterval(tick, w.refreshFrequency || 5000);
  })
  .catch((e) => { console.error(e); boot('เปิด dashboard ไม่ได้\n' + e.message, true); });
</script>
</body>
</html>
